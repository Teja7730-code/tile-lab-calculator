<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#dceeff">
<title>Ceramic Lab Calculator</title>

<style>
/* =========================================================
   CERAMIC LAB CALCULATOR
   PREMIUM APPLE LIQUID GLASS UI
========================================================= */

:root{
    --bg1:#dbeafe;
    --bg2:#e0f2fe;
    --bg3:#f8fbff;

    --glass:rgba(255,255,255,.46);
    --glass-strong:rgba(255,255,255,.66);
    --glass-soft:rgba(255,255,255,.30);

    --border:rgba(255,255,255,.78);
    --text:#102033;
    --muted:#6b7d91;

    --blue:#3b82f6;
    --cyan:#06b6d4;
    --purple:#7c3aed;
    --green:#16a34a;
    --orange:#f97316;
    --red:#ef4444;

    --shadow:0 25px 70px rgba(38,83,125,.16);
    --shadow-small:0 12px 30px rgba(38,83,125,.14);

    --radius:28px;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Roboto,
        sans-serif;
    color:var(--text);
}

body{
    min-height:100vh;
    overflow-x:hidden;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(59,130,246,.24),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(6,182,212,.22),
            transparent 28%
        ),
        radial-gradient(
            circle at 70% 90%,
            rgba(124,58,237,.10),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--bg1),
            var(--bg2) 50%,
            var(--bg3)
        );
}

/* Floating glass lights */

body::before,
body::after{
    content:"";
    position:fixed;
    width:360px;
    height:360px;
    border-radius:50%;
    filter:blur(65px);
    opacity:.28;
    pointer-events:none;
    z-index:-1;
    animation:floatBlob 12s ease-in-out infinite alternate;
}

body::before{
    background:#60a5fa;
    left:-130px;
    bottom:-130px;
}

body::after{
    background:#22d3ee;
    right:-120px;
    top:-130px;
    animation-delay:-5s;
}

@keyframes floatBlob{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(45px,30px) scale(1.12);
    }
}

.hidden{
    display:none!important;
}

/* =========================================================
   GLASS
========================================================= */

.glass{
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.60),
            rgba(255,255,255,.32)
        );

    border:1px solid var(--border);

    backdrop-filter:
        blur(30px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(160%);

    box-shadow:
        var(--shadow),
        inset 0 1px rgba(255,255,255,.95),
        inset 0 -1px rgba(255,255,255,.25);
}

/* =========================================================
   LOGIN
========================================================= */

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-card{
    width:min(440px,94vw);
    padding:45px 36px;
    border-radius:38px;
    text-align:center;

    animation:
        loginAppear
        .8s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes loginAppear{
    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.94);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.logo{
    width:78px;
    height:78px;
    margin:0 auto 22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:25px;

    color:white;
    font-size:25px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #06b6d4
        );

    box-shadow:
        0 18px 40px rgba(37,128,236,.35),
        inset 0 1px rgba(255,255,255,.65);

    animation:logoFloat 4s ease-in-out infinite;
}

@keyframes logoFloat{
    50%{
        transform:translateY(-5px) rotate(1deg);
    }
}

.login-title{
    margin:0;
    font-size:34px;
    font-weight:750;
    letter-spacing:-1px;
}

.login-subtitle{
    color:var(--muted);
    margin:
        10px
        0
        28px;
    font-size:14px;
}

.input{
    width:100%;
    height:53px;

    border:
        1px solid
        rgba(255,255,255,.85);

    border-radius:18px;

    background:
        rgba(255,255,255,.62);

    padding:
        0
        17px;

    font-size:15px;
    color:var(--text);

    outline:none;

    margin:6px 0;

    box-shadow:
        inset 0 1px rgba(255,255,255,.8);

    transition:.25s;
}

.input:focus{
    border-color:
        rgba(59,130,246,.65);

    box-shadow:
        0 0 0 4px
        rgba(59,130,246,.12);
}

.login-button{
    width:100%;
    margin-top:15px;
}

.login-error{
    min-height:20px;
    margin-top:7px;
    color:#dc2626;
    font-size:13px;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    border:0;
    border-radius:999px;

    min-height:45px;

    padding:
        12px
        22px;

    font-weight:700;
    font-size:14px;

    cursor:pointer;

    transition:
        transform .25s,
        box-shadow .25s,
        background .25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.primary{
    color:white;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #06b6d4
        );

    box-shadow:
        0 12px 28px
        rgba(37,128,236,.28);
}

.primary:hover{
    box-shadow:
        0 17px 35px
        rgba(37,128,236,.38);
}

.secondary{
    color:#27445e;
    background:
        rgba(255,255,255,.63);

    border:
        1px solid
        rgba(255,255,255,.8);
}

.danger{
    color:white;

    background:
        linear-gradient(
            135deg,
            #ef4444,
            #f97316
        );

    box-shadow:
        0 12px 25px
        rgba(239,68,68,.24);
}

.small-btn{
    min-height:37px;
    padding:9px 15px;
    font-size:12px;
}

/* =========================================================
   APP
========================================================= */

.app{
    min-height:100vh;
    padding:18px;

    display:flex;
    gap:17px;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:260px;
    flex-shrink:0;

    border-radius:32px;

    padding:18px 13px;

    display:flex;
    flex-direction:column;

    position:sticky;
    top:18px;

    height:
        calc(100vh - 36px);

    overflow:hidden;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;

    padding:
        6px
        10px
        25px;
}

.brand-icon{
    width:45px;
    height:45px;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:14px;
    font-weight:800;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #06b6d4
        );

    box-shadow:
        0 10px 25px
        rgba(37,128,236,.28);
}

.brand-name{
    font-weight:800;
    font-size:16px;
}

.brand-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.nav{
    display:grid;
    gap:6px;
}

.nav-button{
    border:0;
    background:transparent;

    color:#50657a;

    text-align:left;

    padding:
        13px
        14px;

    border-radius:16px;

    cursor:pointer;

    font-size:13px;
    font-weight:650;

    transition:.22s;
}

.nav-button:hover{
    background:
        rgba(255,255,255,.43);
}

.nav-button.active{
    color:#075985;

    background:
        rgba(255,255,255,.67);

    box-shadow:
        inset 0 1px rgba(255,255,255,.95),
        0 5px 16px rgba(50,90,120,.08);
}

.nav-icon{
    display:inline-block;
    width:24px;
}

.sidebar-bottom{
    margin-top:auto;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    min-width:0;

    padding:
        3px
        3px
        30px;

    overflow:auto;
}

.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:
        5px
        5px
        18px;
}

.topbar-title{
    margin:0;
    font-size:27px;
    letter-spacing:-.7px;
}

.topbar-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.system-status{
    display:flex;
    align-items:center;
    gap:7px;

    padding:
        9px
        14px;

    border-radius:999px;

    background:
        rgba(255,255,255,.56);

    color:#486177;

    font-size:11px;
}

.status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 10px #22c55e;
}

/* =========================================================
   CARDS
========================================================= */

.grid{
    display:grid;
    grid-template-columns:
        repeat(12,1fr);

    gap:15px;
}

.card{
    border-radius:26px;
    padding:21px;

    animation:
        cardAppear
        .45s
        ease both;
}

@keyframes cardAppear{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.span-12{grid-column:span 12}
.span-8{grid-column:span 8}
.span-6{grid-column:span 6}
.span-4{grid-column:span 4}
.span-3{grid-column:span 3}

.card-title{
    margin:0 0 5px;
    font-size:18px;
}

.card-sub{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
}

.metric{
    font-size:35px;
    font-weight:800;
    letter-spacing:-1px;
    margin-top:8px;
}

.metric-label{
    color:var(--muted);
    font-size:12px;
}

/* =========================================================
   TABLES
========================================================= */

.table-container{
    width:100%;
    overflow:auto;

    border-radius:19px;

    background:
        rgba(255,255,255,.38);

    border:
        1px solid
        rgba(255,255,255,.55);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:650px;
}

th{
    padding:11px;
    text-align:left;

    color:#50657a;

    font-size:11px;
    font-weight:750;

    background:
        rgba(255,255,255,.43);

    white-space:nowrap;
}

td{
    padding:9px 11px;

    border-top:
        1px solid
        rgba(120,145,170,.12);

    font-size:12px;
}

.table-input{
    width:90px;
    height:36px;

    border:1px solid
        rgba(255,255,255,.85);

    border-radius:11px;

    background:
        rgba(255,255,255,.67);

    padding:0 9px;

    outline:none;
}

.table-input:focus{
    border-color:#60a5fa;
}

/* =========================================================
   FORM LAYOUT
========================================================= */

.form-grid{
    display:grid;
    grid-template-columns:
        repeat(4,1fr);
    gap:12px;
}

.field label{
    display:block;
    color:var(--muted);
    font-size:11px;
    font-weight:650;
    margin:0 0 5px 4px;
}

.field .input{
    margin:0;
}

.action-row{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:15px;
}

/* =========================================================
   BADGES
========================================================= */

.badge{
    display:inline-flex;
    align-items:center;

    padding:
        5px
        9px;

    border-radius:999px;

    font-size:10px;
    font-weight:750;
}

.badge-good{
    background:#dcfce7;
    color:#166534;
}

.badge-warning{
    background:#fef3c7;
    color:#92400e;
}

.badge-danger{
    background:#fee2e2;
    color:#991b1b;
}

.badge-blue{
    background:#dbeafe;
    color:#1d4ed8;
}

/* =========================================================
   PERIODIC TABLE
========================================================= */

.periodic-shell{
    overflow:auto;
    padding-bottom:10px;
}

.periodic-grid{
    display:grid;

    grid-template-columns:
        repeat(18, minmax(45px,1fr));

    gap:5px;

    min-width:900px;
}

.element{
    min-height:63px;

    border:
        1px solid
        rgba(255,255,255,.75);

    border-radius:12px;

    cursor:pointer;

    background:
        rgba(255,255,255,.55);

    transition:
        transform .22s,
        box-shadow .22s,
        background .22s;

    position:relative;

    overflow:hidden;
}

.element::after{
    content:"";
    position:absolute;
    width:70px;
    height:70px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    filter:blur(15px);
    top:-35px;
    left:-35px;
}

.element:hover{
    transform:
        translateY(-4px)
        scale(1.04);

    background:
        rgba(255,255,255,.85);

    box-shadow:
        0 10px 25px
        rgba(50,90,120,.17);
}

.element-number{
    position:absolute;
    top:5px;
    left:7px;
    font-size:8px;
    color:var(--muted);
}

.element-symbol{
    margin-top:17px;
    display:block;
    font-size:18px;
    font-weight:800;
}

.element-name{
    display:block;
    font-size:8px;
    color:var(--muted);
    margin-top:2px;
}

.element-weight{
    display:block;
    font-size:7px;
    color:#789;
    margin-top:2px;
}

/* =========================================================
   FORMULA BOX
========================================================= */

.formula-box{
    padding:17px;

    border-radius:19px;

    background:
        linear-gradient(
            135deg,
            rgba(59,130,246,.10),
            rgba(6,182,212,.08)
        );

    border:
        1px solid
        rgba(255,255,255,.7);

    margin-top:12px;
}

.formula{
    font-size:18px;
    font-weight:800;
    letter-spacing:.2px;
}

.formula-detail{
    color:var(--muted);
    font-size:12px;
    margin-top:6px;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress{
    width:100%;
    height:9px;
    border-radius:999px;
    background:rgba(120,145,170,.15);
    overflow:hidden;
}

.progress-bar{
    height:100%;
    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            #3b82f6,
            #06b6d4
        );

    transition:
        width .5s
        ease;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:25px;

    transform:
        translateX(-50%)
        translateY(30px);

    padding:
        12px
        18px;

    border-radius:999px;

    background:
        rgba(20,35,55,.88);

    color:white;

    font-size:12px;

    opacity:0;

    pointer-events:none;

    transition:.3s;

    z-index:9999;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.22);
}

.toast.show{
    opacity:1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

    .sidebar{
        width:220px;
    }

    .span-8,
    .span-6{
        grid-column:span 12;
    }

    .span-4{
        grid-column:span 6;
    }

    .form-grid{
        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:720px){

    body{
        overflow:auto;
    }

    .app{
        flex-direction:column;
        padding:10px;
    }

    .sidebar{
        position:relative;
        top:0;

        width:100%;
        height:auto;

        border-radius:25px;

        padding:12px;
    }

    .brand{
        padding-bottom:12px;
    }

    .nav{
        grid-template-columns:
            repeat(2,1fr);
    }

    .sidebar-bottom{
        margin-top:10px;
    }

    .main{
        padding:0 0 30px;
    }

    .topbar{
        margin-top:10px;
    }

    .topbar-title{
        font-size:22px;
    }

    .system-status{
        display:none;
    }

    .span-4,
    .span-3{
        grid-column:span 12;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .login-card{
        padding:38px 25px;
    }
}
</style>
</head>

<body>

<!-- ======================================================
     LOGIN
====================================================== -->

<section

    <div class="glass login-card">

            autocomplete="current-password"
            placeholder="Password">

        <div
            id="loginError"
            class="login-error">
        </div>

        <button
            class="btn primary login-button"
            onclick="login()">
            Login
        </button>

    </div>

</section>


<!-- ======================================================
     APPLICATION
====================================================== -->

<section

    class="app hidden">

    <aside class="glass sidebar">

            <button

            <button

            </button>

        </nav>


        <div class="sidebar-bottom">

            <button
                class="btn danger"
                style="width:100%"

                Logout

            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <div class="topbar">

            <div>

                <h2
                    id="pageTitle"
                    class="topbar-title">
                    Dashboard
                </h2>

                <div class="topbar-sub">
                    Professional ceramic formulation workspace
                </div>

            </div>

            <div class="system-status">

                <span class="status-dot"></span>

                System Ready

            </div>

        </div>


        <div id="content"></div>

    </main>

</section>


<div
    id="toast"
    class="toast">
</div>

/* Calculate molecular weights automatically */

const MOLECULAR_WEIGHTS = {};

for(const oxide in STOICH){

    let total = 0;

    for(const element in STOICH[oxide]){

        total +=
            ATOMIC_WEIGHTS[element] *
            STOICH[oxide][element];

    }

    MOLECULAR_WEIGHTS[oxide] = total;

}

function calculateBatch(){

    const size =
        parseFloat(
            document.getElementById(
                "batchSize"
            ).value
        ) || 0;


    const recipe =
        rawMaterials.map(
            () => 0
        );


    document
        .querySelectorAll(".batch-percent")
        .forEach(input => {

            recipe[
                Number(input.dataset.index)
            ] =
                parseFloat(input.value) || 0;

        });


    const total =
        recipe.reduce(
            (a,b)=>a+b,
            0
        );


    let cost = 0;

    rawMaterials.forEach(
        (material,index) => {

            const kg =
                size *
                recipe[index] /
                100;

            const kgCell =
                document.getElementById(
                    `batchKg-${index}`
                );

            if(kgCell)
                kgCell.textContent =
                    kg.toFixed(2);

            cost +=
                kg *
                material.cost;

        }
    );


    document
        .getElementById("batchTotal")
        .value =
            total.toFixed(3);

    document
        .getElementById("batchCost")
        .value =
            cost.toFixed(2);


    const chemistry =
        calculateChemistry(
            recipe
        );


    renderChemistryTable(
        "batchChemistry",
        chemistry
    );

}


function calculateChemistry(recipe){

    const result = {};

    OXIDES.forEach(
        oxide => {

            let value = 0;

            rawMaterials.forEach(
                (material,index) => {

                    const oxideValue =
                        material.oxides[
                            oxide
                        ] || 0;

                    value +=
                        recipe[index] *
                        oxideValue /
                        100;

                }
            );

            result[oxide] = value;

        }
    );

    return result;

}


function renderChemistryTable(
    containerId,
    chemistry
){

    let html = `

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Oxide</th>
                        <th>Weight %</th>
                        <th>Molecular Weight</th>
                        <th>Moles</th>
                        <th>Group</th>

                    </tr>

                </thead>

                <tbody>

    `;


    OXIDES.forEach(
        oxide => {

            const value =
                chemistry[oxide] || 0;

            const mw =
                MOLECULAR_WEIGHTS[
                    oxide
                ] || 1;

            const moles =
                oxide === "LOI"
                    ? 0
                    : value / mw;


            let group = "Other";

            if(FLUXES.includes(oxide))
                group = "Flux";

            if(
                ["SiO2","B2O3","P2O5"]
                    .includes(oxide)
            )
                group =
                    "Network former";

            if(oxide==="Al2O3")
                group =
                    "Intermediate";


            html += `

                <tr>

                    <td>
                        <b>${prettyOxide(oxide)}</b>
                    </td>

                    <td>
                        ${value.toFixed(4)}
                    </td>

                    <td>
                        ${mw.toFixed(4)}
                    </td>

                    <td>
                        ${moles.toFixed(6)}
                    </td>

                    <td>
                        <span class="badge badge-blue">
                            ${group}
                        </span>
                    </td>

                </tr>

            `;

        }
    );


    html += `
                </tbody>
            </table>
        </div>
    `;

    document
        .getElementById(containerId)
        .innerHTML =
            html;

}

function getCurrentReverseTarget(){

    const target = {};

    document

/*
    Automatic formulation algorithm.

    This is a constrained multi-objective
    coordinate-search optimizer.

    It respects:
        minimum %
        maximum %
        total = 100%

    and minimizes weighted oxide error.
*/

function runOptimizer(){

    const target =
        getCurrentReverseTarget();


    const active =
        rawMaterials
            .map(
                (m,index)=>({
                    material:m,
                    index
                })
            )
            .filter(
                x => x.material.use
            );


    if(!active.length)
        return;


    let x =
        rawMaterials.map(
            material =>
                Math.max(
                    material.min || 0,
                    0
                )
        );


    let minTotal =
        x.reduce(
            (a,b)=>a+b,
            0
        );


    if(minTotal>100){

        x =
            rawMaterials.map(
                () => 100/rawMaterials.length
            );

    }
    else{

        let remaining =
            100-minTotal;

        let candidates =
            active.filter(
                a =>
                    (a.material.max || 100)
                    >
                    (a.material.min || 0)
            );


        while(
            remaining>0.00001 &&
            candidates.length
        ){

            let share =
                remaining /
                candidates.length;

            let added = 0;

            candidates =
                candidates.filter(
                    a => {

                        const room =
                            (a.material.max || 100)
                            -
                            x[a.index];

                        const take =
                            Math.min(
                                room,
                                share
                            );

                        x[a.index] += take;

                        added += take;

                        return room >
                            share*.05;

                    }
                );

            remaining -= added;

            if(added<.00001)
                break;

        }

    }


    /*
       Coordinate exchange.

       Move small quantities between
       two materials whenever the total
       weighted error improves.
    */

    const weights = {};

    OXIDES.forEach(
        oxide => {

            weights[oxide] =
                oxide==="SiO2" ||
                oxide==="Al2O3"
                    ? 2
                    : oxide==="LOI"
                        ? .5
                        : 1.2;

        }
    );


    function objective(recipe){

        const chemistry =
            calculateChemistry(recipe);

        let score = 0;

        OXIDES.forEach(
            oxide => {

                const difference =
                    (
                        chemistry[oxide] -
                        (target[oxide] || 0)
                    );

                score +=
                    difference *
                    difference *
                    weights[oxide];

            }
        );

        return score;

    }


    let current =
        objective(x);


    let step = 2.5;


    for(
        let iteration=0;
        iteration<900;
        iteration++
    ){

        let improved=false;


        for(
            let i=0;
            i<rawMaterials.length;
            i++
        ){

            if(!rawMaterials[i].use)
                continue;


            for(
                let j=0;
                j<rawMaterials.length;
                j++
            ){

                if(i===j)
                    continue;

                if(!rawMaterials[j].use)
                    continue;


                const available =
                    x[j] -
                    (
                        rawMaterials[j].min || 0
                    );


                const room =
                    (
                        rawMaterials[i].max || 100
                    ) -
                    x[i];


                const move =
                    Math.min(
                        step,
                        available,
                        room
                    );


                if(move<=0)
                    continue;


                x[i]+=move;
                x[j]-=move;


                const score =
                    objective(x);


                if(score < current){

                    current =
                        score;

                    improved=true;

                }
                else{

                    x[i]-=move;
                    x[j]+=move;

                }

            }

        }


        if(!improved){

            step *= .55;

            if(step<.01)
                break;

        }

    }


    /*
       Clean very small values.
    */

    x =
        x.map(
            value =>
                Math.abs(value)<.01
                    ? 0
                    : value
        );


    /*
       Final normalization.
    */

    const total =
        x.reduce(
            (a,b)=>a+b,
            0
        );

    if(total>0){

        x =
            x.map(
                (v,index) => {

                    if(
                        rawMaterials[index].min===0 &&
                        rawMaterials[index].max>=100
                    )
                        return v;

                    return v;

                }
            );

    }


    const chemistry =
        calculateChemistry(x);


    let absError=0;
    let count=0;

    OXIDES.forEach(
        oxide => {

            absError +=
                Math.abs(
                    chemistry[oxide] -
                    (target[oxide] || 0)
                );

            count++;

        }
    );


    const avgError =
        absError/count;


    let cost=0;

    const batchSize =
        parseFloat(
            document
                .getElementById(
                    "reverseBatchSize"
                )
                ?.value
        ) || 1000;


    rawMaterials.forEach(
        (material,index) => {

            cost +=
                (
                    x[index]/100 *
                    batchSize
                ) *
                material.cost;

        }
    );


    document
        .getElementById(
            "reverseAvgError"
        )
        .value =
            avgError.toFixed(4);

    document
        .getElementById(
            "reverseCost"
        )
        .value =
            cost.toFixed(2);


    renderReverseRecipe(
        x,
        batchSize
    );

    renderReverseComparison(
        target,
        chemistry
    );

}


function renderReverseRecipe(
    recipe,
    batchSize
){

                        <th>Max</th>

                </tbody>

        .getElementById(

}


function renderReverseComparison(
    target,
    chemistry
){

    let html = `

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Oxide</th>
                        <th>Target %</th>
                        <th>Calculated %</th>
                        <th>Difference</th>
                        <th>Error</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

    `;


    OXIDES.forEach(
        oxide => {

            const t =
                target[oxide] || 0;

            const c =
                chemistry[oxide] || 0;

            const diff =
                c-t;

            const abs =
                Math.abs(diff);


            let status =
                "GOOD";

            let badge =
                "badge-good";


            if(abs>.75){

                status="TUNE";
                badge="badge-warning";

            }

            if(abs>1.5){

                status="HIGH";
                badge="badge-danger";

            }


            html += `

                <tr>

                    <td>
                        <b>${prettyOxide(oxide)}</b>
                    </td>

                    <td>
                        ${t.toFixed(3)}
                    </td>

                    <td>
                        ${c.toFixed(3)}
                    </td>

                    <td>
                        ${diff>=0?"+":""}${diff.toFixed(3)}
                    </td>

                    <td>
                        ${abs.toFixed(3)}
                    </td>

                    <td>
                        <span
                            class="badge ${badge}">
                            ${status}
                        </span>
                    </td>

                </tr>

            `;

        }
    );


    html += `
                </tbody>
            </table>
        </div>
    `;


    document
        .getElementById(
            "reverseComparison"
        )
        .innerHTML =
            html;

}

function calculateUMF(){

    const values={};

    document
        .querySelectorAll(".umf-input")
        .forEach(
            input => {

                values[
                    input.dataset.oxide
                ] =
                    parseFloat(
                        input.value
                    ) || 0;

            }
        );


    let fluxMoles=0;


    FLUXES.forEach(
        oxide => {

            const value =
                values[oxide] || 0;

            const mw =
                MOLECULAR_WEIGHTS[
                    oxide
                ] || 1;

            fluxMoles +=
                value/mw;

        }
    );


    document
        .getElementById(
            "umfFluxTotal"
        )
        .textContent =
            fluxMoles.toFixed(6);


    OXIDES.forEach(
        oxide => {

            const value =
                values[oxide] || 0;

            const mw =
                MOLECULAR_WEIGHTS[
                    oxide
                ] || 1;

            const moles =
                oxide==="LOI"
                    ? 0
                    : value/mw;

            const unity =
                fluxMoles>0
                    ? moles/fluxMoles
                    : 0;


            const molesCell =
                document.getElementById(
                    `umfMoles-${oxide}`
                );

            const unityCell =
                document.getElementById(
                    `umfUnity-${oxide}`
                );


            if(molesCell)
                molesCell.textContent =
                    moles.toFixed(6);

            if(unityCell)
                unityCell.textContent =
                    unity.toFixed(5);

        }
    );


    const si =
        fluxMoles>0
            ? (
                (values.SiO2 || 0) /
                MOLECULAR_WEIGHTS.SiO2
            ) / fluxMoles
            : 0;


    const al =
        fluxMoles>0
            ? (
                (values.Al2O3 || 0) /
                MOLECULAR_WEIGHTS.Al2O3
            ) / fluxMoles
            : 0;


    document
        .getElementById("umfSi")
        .textContent =
            si.toFixed(4);

    document
        .getElementById("umfAl")
        .textContent =
            al.toFixed(4);

}

function buildPeriodic(){

    const grid =
        document.getElementById(
            "periodicGrid"
        );


    ELEMENTS.forEach(
        element => {

            const [
                symbol,
                atomicNumber,
                weight,
                column,
                row
            ] = element;


            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "element";


            button.style.gridColumn =
                column;

            button.style.gridRow =
                row;


            button.innerHTML = `

                <span
                    class="element-number">
                    ${atomicNumber}
                </span>

                <span
                    class="element-symbol">
                    ${symbol}
                </span>

                <span
                    class="element-name">
                    ${elementName(symbol)}
                </span>

                <span
                    class="element-weight">
                    ${weight}
                </span>

            `;


            button.onclick =
                () =>
                    showElement(
                        symbol,
                        atomicNumber,
                        weight
                    );


            grid.appendChild(
                button
            );

        }
    );

}


function showElement(
    symbol,
    number,
    weight
){

    let relevance =
        "General periodic-table reference.";


    if(
        ["Si","Al","B","Na","K","Ca","Mg","Zn","Ba","Li","Sr","Zr","Fe","Ti"]
            .includes(symbol)
    ){

        relevance =
            "Important element used in ceramic oxide chemistry.";

    }


    document
        .getElementById(
            "elementInfo"
        )
        .innerHTML = `

        <div
            style="
            display:flex;
            gap:20px;
            align-items:center">

            <div
                class="logo"
                style="
                width:70px;
                height:70px;
                margin:0;
                border-radius:20px">

                ${symbol}

            </div>

            <div>

                <div
                    style="
                    font-size:25px;
                    font-weight:800">

                    ${elementName(symbol)}

                </div>

                <div class="card-sub">

                    Atomic Number:
                    <b>${number}</b>

                    &nbsp;&nbsp;

                    Atomic Weight:
                    <b>${weight}</b>

                </div>

                <div
                    class="card-sub"
                    style="margin-top:5px">

                    ${relevance}

                </div>

            </div>

        </div>

    `;

}

function prettyOxide(oxide){

    const map={

        SiO2:"SiO₂",
        Al2O3:"Al₂O₃",
        K2O:"K₂O",
        Na2O:"Na₂O",
        CaO:"CaO",
        MgO:"MgO",
        Fe2O3:"Fe₂O₃",
        TiO2:"TiO₂",
        B2O3:"B₂O₃",
        ZnO:"ZnO",
        BaO:"BaO",
        Li2O:"Li₂O",
        SrO:"SrO",
        ZrO2:"ZrO₂",
        P2O5:"P₂O₅",
        MnO:"MnO",
        Cr2O3:"Cr₂O₃",
        LOI:"LOI"

    };

    return map[oxide] || oxide;

}

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2200
    );

}
